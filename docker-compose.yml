services:
  monolith:
    image: ghcr.io/chakarai1234/inference_calculator:latest
    container_name: monolith-inference-calculator
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      CATALOG_CACHE_PATH: "/app/data/hf-catalog.json"
      CATALOG_REFRESH_HOUR: "${CATALOG_REFRESH_HOUR:-2}"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - monolith_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  monolith_data:
